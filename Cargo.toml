[package]
name = "mc-aixi"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Monte-Carlo AIXI (rho-UCT over a Bayesian mixture of FAC-CTW and a surgically dissected Qwen3.8-2B) — Family A of the Self-AIXI research line"
repository = "https://github.com/Euroswarms-Institute/Self-AIXI"

[lib]
name = "mc_aixi"
path = "src/lib.rs"

[dependencies]
half = "2"
memmap2 = "0.9"
rand = "0.9"
rand_chacha = "0.9"
rayon = "1.10"

[profile.release]
lto = "fat"
codegen-units = 1

# Tests exercise CTW/search loops that are painfully slow at opt-level 0.
[profile.test]
opt-level = 2
